[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-framework"
version = "0.1.0"
description = "Metadata-driven PySpark + Delta Lake framework: YAML-configured incremental loads, SCD1/SCD2 merges, data quality and audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Someswara Rao K V" }]
keywords = ["pyspark", "delta-lake", "lakehouse", "scd2", "microsoft-fabric", "databricks"]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# Databricks and Fabric runtimes already provide Spark + Delta; install these locally / in CI.
spark = ["pyspark>=3.5,<3.6", "delta-spark>=3.2,<3.3"]
dev = ["pytest>=7", "pyspark>=3.5,<3.6", "delta-spark>=3.2,<3.3"]

[project.urls]
Homepage = "https://github.com/someshbvrm/metadata-driven-lakehouse-framework"
"Run report" = "https://someshbvrm.github.io/metadata-driven-lakehouse-framework/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
